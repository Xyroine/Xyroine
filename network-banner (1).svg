    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#00cfff" opacity="0">
    <animateMotion dur="6s" repeatCount="indefinite" begin="1.5s" path="M650,60 L510,35 L380,68 L250,42 L130,75 L30,30"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="6s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle r="2.5" fill="#a78bfa" opacity="0">
    <animateMotion dur="5.5s" repeatCount="indefinite" begin="3s" path="M30,480 L140,450 L270,478 L420,460 L560,480 L655,462"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="5.5s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle r="2.5" fill="#fbbf24" opacity="0">
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="2s" path="M130,75 L140,450"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.88;1" dur="4.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
