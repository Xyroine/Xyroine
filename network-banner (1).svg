  <rect x="40" y="236" width="290" height="126" fill="#161b22" rx="8"/>
  <rect x="40" y="236" width="290" height="20" fill="#1c2128" rx="8"/>
  <rect x="40" y="250" width="290" height="6" fill="#1c2128"/>
  <text x="53" y="250" class="mono" fill="#00ff88" font-size="10" font-weight="700">$ traceroute malik</text>
  <text class="mono s1" x="53" y="272" fill="#8b949e" font-size="9.5">1  👋  Khalifal Malik, Network Eng  <tspan fill="#00ff88">0.1ms</tspan></text>
  <text class="mono s2" x="53" y="289" fill="#8b949e" font-size="9.5">2  👀  Interested in Programming    <tspan fill="#00ff88">0.3ms</tspan></text>
  <text class="mono s3" x="53" y="306" fill="#8b949e" font-size="9.5">3  🌱  Currently learning deeper    <tspan fill="#00ff88">0.5ms</tspan></text>
  <text class="mono s4" x="53" y="323" fill="#8b949e" font-size="9.5">4  📫  khalifalmalik@gmail.com     <tspan fill="#00ff88">0.7ms</tspan></text>
  <text class="mono s5" x="53" y="340" fill="#8b949e" font-size="9.5">5  ⚡  Fun fact: I'm alive!         <tspan fill="#00ff88">0.9ms</tspan></text>
  <text class="mono s6" x="53" y="354" fill="#00cfff" font-size="9">&gt;&gt;&gt; Connection established. All hops reachable!</text>
