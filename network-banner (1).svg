  <rect x="345" y="236" width="295" height="20" fill="#1c2128" rx="8"/>
  <rect x="345" y="250" width="295" height="6" fill="#1c2128"/>
  <text x="358" y="250" class="mono" fill="#fbbf24" font-size="10" font-weight="700">$ ifconfig malik0</text>
  <text class="mono s1" x="358" y="272" fill="#8b949e" font-size="9.5">flags=<tspan fill="#00ff88">UP,BROADCAST,RUNNING</tspan>  mtu 9000</text>
  <text class="mono s2" x="358" y="289" fill="#8b949e" font-size="9.5">Role:   <tspan fill="#00cfff">Network Engineer</tspan></text>
  <text class="mono s3" x="358" y="306" fill="#8b949e" font-size="9.5">Mode:   <tspan fill="#a78bfa">Full-Duplex Learner</tspan></text>
  <text class="mono s4" x="358" y="323" fill="#8b949e" font-size="9.5">Speed:  <tspan fill="#fbbf24">Always Improving</tspan></text>
  <text class="mono s5" x="358" y="340" fill="#8b949e" font-size="9.5">Email:  <tspan fill="#00ff88">khalifalmalik@gmail.com</tspan></text>
  <text class="mono s6" x="358" y="357" fill="#8b949e" font-size="9.5">Status: <tspan fill="#00ff88">🟢 ACTIVE</tspan></text>
