  <circle class="n2" cx="130" cy="75" r="2.5" fill="#00cfff"/>
  <circle class="n3" cx="250" cy="42" r="3" fill="#a78bfa"/>
  <circle class="n4" cx="380" cy="68" r="2.5" fill="#00ff88"/>
  <circle class="n5" cx="510" cy="35" r="3" fill="#fbbf24"/>
  <circle class="n6" cx="650" cy="60" r="2.5" fill="#00cfff"/>
  <circle class="n7" cx="140" cy="450" r="2.5" fill="#a78bfa"/>
