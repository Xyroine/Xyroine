<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GitHub Profile Banner — Khalifal Malik Network Engineer</title>
  <desc>Animated dark network themed SVG banner untuk GitHub profile Khalifal Malik</desc>
  <defs>
    <style>
      .mono { font-family: 'Space Mono','Courier New',monospace; }
      @keyframes pulse { 0%,100%{opacity:1;r:3.5} 50%{opacity:0.4;r:2} }
      @keyframes pulse2 { 0%,100%{opacity:1;r:2.5} 50%{opacity:0.3;r:1.5} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes pingdot { 0%,100%{r:4;opacity:1} 50%{r:2;opacity:0.3} }
      @keyframes dash { to{stroke-dashoffset:-24} }
      @keyframes appear { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      @keyframes slideup { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
      @keyframes titleglow { 0%,100%{opacity:1} 50%{opacity:0.75} }
      .n1{animation:pulse 2s ease-in-out infinite}
      .n2{animation:pulse2 2.4s ease-in-out infinite .3s}
      .n3{animation:pulse 1.9s ease-in-out infinite .7s}
      .n4{animation:pulse2 2.2s ease-in-out infinite 1s}
      .n5{animation:pulse 2.6s ease-in-out infinite .5s}
      .n6{animation:pulse2 2s ease-in-out infinite .2s}
      .n7{animation:pulse 2.3s ease-in-out infinite .9s}
      .n8{animation:pulse2 1.8s ease-in-out infinite .4s}
      .cursor{animation:blink 1s step-end infinite}
      .pd1{animation:pingdot 1.4s ease-in-out infinite}
      .pd2{animation:pingdot 1.4s ease-in-out infinite .2s}
      .pd3{animation:pingdot 1.4s ease-in-out infinite .4s}
      .dashed{stroke-dasharray:6 4;animation:dash 1.2s linear infinite}
      .title-anim{animation:titleglow 2.5s ease-in-out infinite}
      .s1{animation:appear .7s ease forwards .2s;opacity:0}
      .s2{animation:appear .7s ease forwards .5s;opacity:0}
      .s3{animation:appear .7s ease forwards .8s;opacity:0}
      .s4{animation:appear .7s ease forwards 1.1s;opacity:0}
      .s5{animation:appear .7s ease forwards 1.4s;opacity:0}
      .s6{animation:appear .7s ease forwards 1.7s;opacity:0}
      .b1{animation:slideup .6s ease forwards .1s;opacity:0}
      .b2{animation:slideup .6s ease forwards .3s;opacity:0}
      .b3{animation:slideup .6s ease forwards .5s;opacity:0}
      .b4{animation:slideup .6s ease forwards .7s;opacity:0}
    </style>
  </defs>
  <rect width="680" height="520" fill="#0d1117" rx="12"/>
  <rect width="680" height="2" fill="#00ff88" opacity="0.7" rx="1"/>
  <rect width="680" height="2" fill="#00ff88" opacity="0.06" rx="1">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,520" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g stroke="#00cfff" stroke-width="0.6" opacity="0.15" fill="none">
    <line x1="30" y1="30" x2="130" y2="75"/>
