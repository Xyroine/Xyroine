  <circle class="pd3" cx="292" cy="28" r="4" fill="#a78bfa"/>
  <text x="305" y="33" class="mono" fill="#00ff88" font-size="10" letter-spacing="2">PING 0ms — CONNECTION ESTABLISHED</text>
