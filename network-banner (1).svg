    <line x1="560" y1="480" x2="655" y2="462"/>
    <line x1="130" y1="75" x2="140" y2="450"/>
    <line x1="380" y1="68" x2="420" y2="460"/>
    <line x1="510" y1="35" x2="560" y2="480"/>
    <line class="dashed" x1="250" y1="42" x2="270" y2="478" stroke="#a78bfa"/>
